name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'VERSION'
      - 'scripts/check-version.sh'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'VERSION'
      - 'scripts/check-version.sh'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        # The preinstalled SDK on ubuntu-latest is enough for compileSdk 35, and
        # android-actions/setup-android@v3 now dies on the image ("Failed to
        # find package 'tools'"), so only install what is actually missing.
        run: |
          set -u
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "platforms:"; ls "$sdk/platforms" 2>/dev/null || true
          echo "build-tools:"; ls "$sdk/build-tools" 2>/dev/null || true
          if [ ! -d "$sdk/platforms/android-35" ]; then
            manager="$sdk/cmdline-tools/latest/bin/sdkmanager"
            [ -x "$manager" ] || manager="$(command -v sdkmanager || true)"
            if [ -x "$manager" ]; then
              yes | "$manager" --sdk_root="$sdk" "platforms;android-35" || true
            fi
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify shared version
        run: |
          ../scripts/check-version.sh
          echo "MOBILE_VERSION=$(tr -d '[:space:]' < ../VERSION)" >> "$GITHUB_ENV"

      - name: Restore signing key
        if: env.KEYSTORE_B64 != ''
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing.p12"
          # AGP wants a JKS, and the runner ships keytool, so convert in place.
          keytool -importkeystore -noprompt \
            -srckeystore "$RUNNER_TEMP/signing.p12" -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" -srcalias "$KEY_ALIAS" \
            -destkeystore "$RUNNER_TEMP/signing.jks" -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" -destkeypass "$KEYSTORE_PASSWORD" \
            -destalias "$KEY_ALIAS"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"

      # Catches a translation that dropped a key or mangled a placeholder before
      # anything is packaged. See docs/adding-a-language.md.
      - name: Run tests and Android lint
        run: gradle --no-daemon testDebugUnitTest lintDebug

      - name: Build APK
        env:
          DEFAULT_STUDIO_URL: ${{ vars.DEFAULT_STUDIO_URL }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/hermes-studio-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: hermes-studio-android
          path: out/hermes-studio-android.apk

      - name: Publish rolling build
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hstudio-direct
          name: HStudio 直连 v${{ env.MOBILE_VERSION }} — Android
          body: |
            HStudio 直连 v${{ env.MOBILE_VERSION }} — 直连自建 Hermes Studio：
            无云服务、无订阅、无登录墙，只填你的服务器地址 + Studio 账号密码。

            构建自 `main` (${{ github.sha }})，使用项目密钥签名，可直接覆盖安装。

            Android 会提示「Play 保护机制未见过此开发者」——选择**仍要安装**即可。
          files: out/hermes-studio-android.apk
          prerelease: true
